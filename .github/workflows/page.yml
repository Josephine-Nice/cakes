name: Page cakes Joséphine

on:
  schedule:
    # Heures en UTC, pour couvrir l'heure d'ete et d'hiver.
    # Chaque nuit : mise a jour juste apres minuit, pour que la page du matin soit rouge.
    # Puis lun-ven :
    # une fois vers 15h30, puis toutes les 10 minutes de 17h a 19h (Paris), periode de la saisie du stock.
    - cron: "5 22 * * *"       # passage a minuit (Paris, heure d'ete) : la page repart au rouge
    - cron: "5 23 * * *"       # passage a minuit (Paris, heure d'hiver)
    - cron: "30 13 * * 1-5"
    - cron: "*/10 15-17 * * 1-5"
  workflow_dispatch:        # permet aussi de la lancer à la main (bouton "Run workflow")

permissions:
  contents: write           # pour enregistrer le journal des productions
  pages: write
  id-token: write

concurrency:
  group: page-cakes
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Calculer et créer la page
        env:
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
          STOCK_SHEET_URL: ${{ secrets.STOCK_SHEET_URL }}
        run: python production_cakes.py --html site/index.html --journal-apres 17:10

      - name: Enregistrer le journal des productions
        run: |
          git config user.name "cakes-bot"
          git config user.email "cakes-bot@users.noreply.github.com"
          git add journal_production.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Journal des productions" && git push)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
